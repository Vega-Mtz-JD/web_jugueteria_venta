name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, tipos y unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db:
    name: Base de datos, integración, build y e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase test db
      - name: Variables de Supabase local
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            | grep -E '^NEXT_PUBLIC_' | tr -d '"' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          # Clave VAPID pública de prueba (la misma de [edge_runtime.secrets] en supabase/config.toml).
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(grep '^VAPID_PUBLIC_KEY' supabase/config.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: npm run test:int
      # El build pre-renderiza páginas con datos del catálogo: necesita Supabase.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
