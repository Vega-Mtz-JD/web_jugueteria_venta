<div style="font-family: Georgia, serif; background: #f6efe3; color: #2b2118; padding: 32px">
  <h1 style="font-size: 24px">Confirma tu cuenta</h1>
  <p style="font-family: Arial, sans-serif; line-height: 1.5">Gracias por registrarte. Toca el botón para confirmar tu correo y empezar a comprar.</p>
  <p>
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #1f4d3a; color: #f6efe3; padding: 12px 20px; border-radius: 10px; font-family: Arial, sans-serif; font-weight: bold; text-decoration: none">Confirmar mi cuenta</a>
  </p>
  <p style="font-family: Arial, sans-serif; font-size: 13px; color: #5a4430">Si no creaste esta cuenta, ignora este correo.</p>
</div>
